openapi: 3.1.0
info:
  title: Marketplace Backend API
  version: 0.1.0
  description: |
    Public API of the Spring Boot backend, used by the Next.js frontend.

    This file starts empty on purpose. Each backend task (A1-A14) adds only its own paths,
    and the frontend generates its TypeScript client from it (openapi-typescript).
    From A1 onward it is exported from the running backend (/v3/api-docs) with a documented command.

    Rules:
    - All authenticated endpoints use `Authorization: Bearer <JWT access token>`.
    - Money is a decimal string in PKR with 2 decimals (D1).
    - Contact details of one side never appear in responses seen by the other side (D11).
    - Every error uses the `Error` schema below.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8080
    description: Local development
security:
  - bearerAuth: []
paths: {}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Money:
      type: string
      description: PKR amount as a decimal string with exactly 2 decimals (D1). Never a float.
      pattern: '^-?\d{1,10}\.\d{2}$'
      examples: ['105000.00']
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code:
              type: string
              description: SNAKE_CASE machine-readable code, e.g. VALIDATION_ERROR, NOT_FOUND, BUDGET_OUTSIDE_BAND
              pattern: '^[A-Z][A-Z0-9_]*$'
            message:
              type: string
              description: Human-readable message, safe to show to the user
            request_id:
              type: string
              format: uuid
            details:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [field, issue]
                properties:
                  field:
                    type: string
                  issue:
                    type: string
  responses:
    ValidationError:
      description: Request failed validation (HTTP 400 or 422 as defined per endpoint)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing, expired or invalid access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated but not allowed (wrong role or not the owner)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource does not exist or is not visible to this user
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: State conflict (e.g. invalid status transition, duplicate)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
